<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            /* border: 2px solid black; */
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>

</head>
<body>
    <h1>Employee Information</h1>

    <p>Welcome to the employee information page. Here you can find details about some of the top CEOs.</p>

    <table>
        <tr>
            <th>No</th>
            <th>Full Name</th>
            <th>Position</th>
            <th>Salary</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Elon Musk</td>
            <td>Tesla CEO</td>
            <td>$9,000,000</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Steve Jobs</td>
            <td>Apple CEO</td>
            <td>$1,300,000</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Bill Gates</td>
            <td>Microsoft CEO</td>
            <td>$1,200,000</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Larry Page</td>
            <td>Google CEO</td>

        </tr>

</html>
